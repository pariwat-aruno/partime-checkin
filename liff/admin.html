<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Owner — บริษัท วอร์ด้า กินแคร์</title>
  <link rel="stylesheet" href="./css/style.css" />
  <style>
    .period-picker { display: flex; gap: 8px; margin-bottom: 16px; }
    .period-picker input[type="month"] { flex: 1; margin: 0; }
    .period-picker button { width: auto; padding: 12px 16px; flex: 0 0 auto; }

    .emp-row {
      border: 1px solid var(--border); border-radius: 10px;
      padding: 14px; margin-bottom: 10px; background: var(--white);
    }
    .emp-row .emp-head {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 8px;
    }
    .emp-row .emp-name { font-weight: 700; font-size: 15px; }
    .emp-row .emp-id   { color: var(--muted); font-size: 12px; }

    .emp-stats {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 6px; margin-bottom: 10px; font-size: 12px;
    }
    .emp-stats .item {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 6px; padding: 8px 4px; text-align: center;
    }
    .emp-stats .item .num   { font-weight: 700; font-size: 16px; color: var(--text); }
    .emp-stats .item .label { color: var(--muted); font-size: 11px; }
    .emp-stats .item.pending .num { color: var(--warning); }
    .emp-stats .item.total   .num { color: var(--cherry); }
    .emp-stats .item.clickable {
      cursor: pointer; border-color: var(--cherry);
      background: var(--cherry-tint);
    }
    .emp-stats .item.clickable:active { background: #f5d6dc; }

    .emp-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .emp-actions button { flex: 1; min-width: 120px; padding: 10px; font-size: 14px; }
    .btn-warning { background: var(--warning); color: var(--white); }
    .btn-warning:active { background: #b45309; }

    .pay-status {
      padding: 4px 10px; border-radius: 12px; font-size: 11px;
      font-weight: 600; display: inline-block;
    }
    .pay-info {
      font-size: 12px; color: var(--muted); margin-bottom: 8px;
    }

    /* Pending modal */
    #pending-modal {
      position: fixed; inset: 0; background: rgba(17,24,39,0.85);
      z-index: 9999; padding: 16px; overflow-y: auto;
    }
    #pending-modal .inner {
      max-width: 480px; margin: 0 auto;
      background: var(--white); border-radius: 12px; padding: 20px;
    }
    #pending-modal h2 { font-size: 16px; margin: 0 0 14px; color: var(--cherry); font-weight: 700; }
    #pending-modal .close-btn {
      width: 100%; padding: 11px; background: var(--reject); color: var(--white);
      border: none; border-radius: 8px; font-weight: 600; margin-top: 8px;
    }
    .pending-item {
      border: 1px solid var(--border); border-radius: 10px;
      padding: 12px; margin-bottom: 10px;
    }
    .pending-item .head { font-weight: 600; margin-bottom: 8px; font-size: 14px; }
    .pending-item .badge {
      display: inline-block; padding: 2px 8px; border-radius: 10px;
      font-size: 11px; font-weight: 600; margin-left: 6px;
    }
    .badge.warn   { background: #fef3c7; color: var(--warning); }
    .badge.danger { background: var(--cherry-tint); color: var(--cherry-dark); }

    .pending-slots {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 4px; margin-bottom: 10px;
    }
    .pending-slots .s {
      aspect-ratio: 1/1; background: var(--bg); border-radius: 6px;
      overflow: hidden; position: relative;
    }
    .pending-slots .s img { width:100%; height:100%; object-fit:cover; }
    .pending-slots .s .empty {
      display:flex; align-items:center; justify-content:center;
      width:100%; height:100%; color:var(--muted); font-size:10px; text-align:center;
    }
    .pending-slots .s .lbl {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: rgba(17,24,39,0.7); color: #fff; font-size: 9px;
      padding: 2px; text-align: center;
    }

    .pending-actions { display: flex; gap: 6px; }
    .pending-actions button { flex: 1; padding: 10px; font-size: 13px; }
    .pending-actions .full   { background: var(--cherry);     color: #fff; }
    .pending-actions .half   { background: var(--cherry-dark); color: #fff; }
    .pending-actions .reject { background: var(--reject);     color: #fff; }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="./img/logo.jpg" alt="VORDA SKINCARE" />
    <div class="brand">บริษัท วอร์ด้า กินแคร์</div>
    <h1>Owner — จัดการยอด</h1>
    <div class="subtitle">เฉพาะเจ้าของ — สรุปยอดต่อพาร์ทไทม์ ปิดยอด ทำเครื่องหมายจ่าย</div>

    <div id="error" class="error" style="display:none"></div>
    <div id="loading" class="muted">กำลังโหลด...</div>

    <div id="content" style="display:none">
      <div class="period-picker">
        <input type="month" id="period" />
        <button id="btn-refresh" class="btn-primary">โหลด</button>
      </div>
      <div id="emp-list"></div>
    </div>
  </div>

  <div class="page-footer">บริษัท วอร์ด้า กินแคร์</div>

  <div id="pending-modal" hidden>
    <div class="inner">
      <h2 id="pending-title">รออนุมัติ</h2>
      <div id="pending-body"></div>
      <button class="close-btn" id="pending-close">ปิด</button>
    </div>
  </div>

  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script type="module">
    import { CONFIG } from './js/config.js';
    import { initAuth, state } from './js/auth.js';
    import { api } from './js/api.js';
    import { showError, clearError } from './js/utils.js';

    const errEl = document.getElementById('error');
    const loadingEl = document.getElementById('loading');
    const contentEl = document.getElementById('content');
    const periodEl = document.getElementById('period');
    const refreshEl = document.getElementById('btn-refresh');
    const listEl = document.getElementById('emp-list');

    function defaultPeriod() {
      const d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    }

    async function boot() {
      const liffId = CONFIG.LIFF_ID_ADMIN;
      if (!liffId) {
        loadingEl.style.display = 'none';
        showError(errEl, 'ยังไม่ได้ตั้ง LIFF_ID_ADMIN ใน config.js');
        return;
      }
      try { await initAuth(liffId); }
      catch (e) {
        loadingEl.style.display = 'none';
        showError(errEl, 'LIFF init: ' + e.message);
        return;
      }
      periodEl.value = defaultPeriod();
      loadingEl.style.display = 'none';
      contentEl.style.display = 'block';
      await load();
    }

    async function load() {
      clearError(errEl);
      listEl.innerHTML = '<div class="muted">กำลังโหลด...</div>';
      try {
        const result = await api.post('getOwnerDashboard', {
          lineUserId: state.lineUserId,
          period: periodEl.value,
        });
        renderList(result.employees, result.period);
      } catch (e) {
        if (e.code === 'not_owner') {
          showError(errEl, 'เฉพาะเจ้าของเท่านั้นที่ใช้หน้านี้ได้');
          listEl.innerHTML = '';
        } else {
          showError(errEl, e.message || e.code);
        }
      }
    }

    function renderList(employees) {
      if (!employees || employees.length === 0) {
        listEl.innerHTML = '<div class="muted">ไม่มีพาร์ทไทม์ active</div>';
        return;
      }
      listEl.innerHTML = employees.map(function (e) {
        const pay = e.payment;
        const total = e.total_amount.toLocaleString();
        let actions = '';
        if (!pay) {
          const disable = e.total_amount === 0 ? ' disabled' : '';
          actions = '<button class="btn-primary" data-action="close" data-emp="' + e.employee_id + '"' + disable + '>' +
            'ปิดยอด ' + total + ' บาท</button>';
          if (e.pending > 0) {
            actions += '<button class="btn-warning" data-action="close-force" data-emp="' + e.employee_id + '">' +
              'ปิดทั้งที่มี pending ' + e.pending + '</button>';
          }
        } else if (pay.status === 'รอจ่าย') {
          actions = '<button class="btn-primary" data-action="paid" data-pid="' + pay.payment_id + '">' +
            'ทำเครื่องหมายจ่ายแล้ว</button>';
        } else {
          actions = '<button class="btn-primary" disabled>จ่ายแล้ว</button>';
        }

        return '<div class="emp-row">' +
          '<div class="emp-head">' +
            '<div><span class="emp-name">' + escape_(e.display_name) + '</span> ' +
              '<span class="emp-id">' + escape_(e.employee_id) + '</span></div>' +
            (pay ? '<span class="pay-status status ' + pay.status + '">' + pay.status + '</span>' : '') +
          '</div>' +
          (pay ? '<div class="pay-info">' +
            pay.payment_id + ' • ปิดยอด ' + escape_(pay.closed_at) +
            (pay.paid_at ? ' • จ่าย ' + escape_(pay.paid_at) : '') +
          '</div>' : '') +
          '<div class="emp-stats">' +
            '<div class="item"><div class="num">' + e.approved_full + '</div><div class="label">เต็มวัน</div></div>' +
            '<div class="item"><div class="num">' + e.approved_half + '</div><div class="label">ครึ่งวัน</div></div>' +
            '<div class="item pending' + (e.pending > 0 ? ' clickable' : '') + '"' +
              (e.pending > 0 ? ' data-pending-emp="' + e.employee_id + '"' : '') + '>' +
              '<div class="num">' + e.pending + '</div>' +
              '<div class="label">' + (e.pending > 0 ? 'รออนุมัติ ▸' : 'รออนุมัติ') + '</div>' +
            '</div>' +
            '<div class="item total"><div class="num">' + total + '</div><div class="label">รวม ฿</div></div>' +
          '</div>' +
          '<div class="emp-actions">' + actions + '</div>' +
        '</div>';
      }).join('');

      listEl.querySelectorAll('button[data-action]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          const a = btn.dataset.action;
          if (a === 'close')        return doClose(btn.dataset.emp, false);
          if (a === 'close-force')  return doClose(btn.dataset.emp, true);
          if (a === 'paid')         return doMarkPaid(btn.dataset.pid);
        });
      });
      listEl.querySelectorAll('[data-pending-emp]').forEach(function (el) {
        el.addEventListener('click', function () { openPending(el.dataset.pendingEmp); });
      });
    }

    const pmodal = document.getElementById('pending-modal');
    const ptitle = document.getElementById('pending-title');
    const pbody  = document.getElementById('pending-body');
    document.getElementById('pending-close').addEventListener('click', function () { pmodal.hidden = true; });

    async function openPending(employeeId) {
      pmodal.hidden = false;
      ptitle.textContent = 'รออนุมัติ — ' + employeeId;
      pbody.innerHTML = '<div class="muted">กำลังโหลด...</div>';
      try {
        const r = await api.post('getPendingForEmployee', {
          lineUserId: state.lineUserId, employeeId: employeeId,
        });
        ptitle.textContent = 'รออนุมัติ — ' + r.displayName + ' (' + r.employeeId + ')';
        renderPendingItems(r.items);
      } catch (e) {
        pbody.innerHTML = '<div class="error">ผิดพลาด: ' + (e.message || e.code) + '</div>';
      }
    }

    function renderPendingItems(items) {
      if (!items || items.length === 0) {
        pbody.innerHTML = '<div class="muted">ไม่มีรายการรออนุมัติ</div>';
        return;
      }
      pbody.innerHTML = items.map(function (it) {
        const slotsHtml = it.slots.map(function (s) {
          if (s.completed) {
            return '<div class="s"><img src="' + escape_(s.thumb) + '" alt=""/>' +
                   '<div class="lbl">' + escape_(s.label) + '</div></div>';
          }
          return '<div class="s"><div class="empty">' + escape_(s.label) + '<br/>—</div></div>';
        }).join('');
        const incomplete = it.scan_count < 4;
        const badges = [];
        if (incomplete) badges.push('<span class="badge warn">สแกน ' + it.scan_count + '/4</span>');
        if (it.has_out_of_range) badges.push('<span class="badge danger">นอกรัศมี</span>');

        return '<div class="pending-item" data-id="' + escape_(it.checkin_id) + '">' +
          '<div class="head">' + escape_(it.date) + ' ' + badges.join('') + '</div>' +
          '<div class="pending-slots">' + slotsHtml + '</div>' +
          '<div class="pending-actions">' +
            '<button class="full"   data-act="approve" data-type="full">เต็ม 400</button>' +
            '<button class="half"   data-act="approve" data-type="half">ครึ่ง 200</button>' +
            '<button class="reject" data-act="reject">ไม่อนุมัติ</button>' +
          '</div>' +
        '</div>';
      }).join('');

      pbody.querySelectorAll('.pending-item').forEach(function (item) {
        const id = item.dataset.id;
        item.querySelectorAll('button[data-act]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            doApprove(id, btn.dataset.act, btn.dataset.type);
          });
        });
      });
    }

    async function doApprove(checkinId, action, type) {
      const labelMap = { full: 'เต็มวัน 400', half: 'ครึ่งวัน 200' };
      const what = action === 'reject' ? 'ไม่อนุมัติ' : ('อนุมัติ ' + (labelMap[type] || ''));
      if (!window.confirm('ยืนยัน ' + what + ' สำหรับ ' + checkinId + ' ?')) return;
      try {
        await api.post('approveCheckin', {
          lineUserId: state.lineUserId, checkinId: checkinId,
          action: action, type: type,
        });
        const m = ptitle.textContent.match(/\((EMP-\d+)\)/);
        if (m) await openPending(m[1]);
        await load();
      } catch (e) { alert('ผิดพลาด: ' + (e.message || e.code)); }
    }

    async function doClose(employeeId, confirm) {
      const period = periodEl.value;
      const msg = confirm
        ? 'ปิดยอด ' + employeeId + ' รอบ ' + period + ' (มี pending ค้าง — ปิดเลยจะไม่นับ pending) ยืนยัน?'
        : 'ปิดยอด ' + employeeId + ' รอบ ' + period + ' ?';
      if (!window.confirm(msg)) return;
      try {
        const result = await api.post('closePeriod', {
          lineUserId: state.lineUserId, employeeId: employeeId,
          period: period, confirm: confirm,
        });
        alert('ปิดยอดสำเร็จ — รวม ' + result.total + ' บาท');
        await load();
      } catch (e) {
        if (e.code === 'has_pending') {
          alert('ยังมี ' + e.data.pending + ' วัน pending — กดปุ่ม "ปิดทั้งที่มี pending" ถ้ายืนยัน');
        } else {
          alert('ผิดพลาด: ' + (e.message || e.code));
        }
      }
    }

    async function doMarkPaid(paymentId) {
      if (!window.confirm('ยืนยันว่าโอนเงินสำหรับ ' + paymentId + ' แล้ว?')) return;
      try {
        await api.post('markPaid', { lineUserId: state.lineUserId, paymentId: paymentId });
        alert('ทำเครื่องหมายจ่ายแล้ว');
        await load();
      } catch (e) { alert('ผิดพลาด: ' + (e.message || e.code)); }
    }

    function escape_(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    refreshEl.addEventListener('click', load);
    periodEl.addEventListener('change', load);
    boot();
  </script>
</body>
</html>
