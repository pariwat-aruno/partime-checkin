<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>เช็คอิน — partime-checkin</title>
  <link rel="stylesheet" href="./css/style.css" />
  <style>
    .slot-status-grid {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 6px; margin-bottom: 14px;
    }
    .slot-status {
      background: #f0f0f0; border-radius: 8px; padding: 10px 4px;
      text-align: center; font-size: 11px;
    }
    .slot-status.done    { background: #e8f5e9; color: #1b5e20; }
    .slot-status.current { background: #fff3e0; color: #e65100; outline: 2px solid #fbbc04; }
    .slot-status .icon   { font-size: 20px; display: block; margin-bottom: 2px; }
    .slot-status .label  { font-weight: 600; }

    .current-slot-banner {
      background: #06c755; color: #fff; padding: 12px;
      border-radius: 8px; text-align: center; margin-bottom: 14px;
      font-weight: 600;
    }

    #video-wrap {
      position: relative; width: 100%; aspect-ratio: 1/1;
      background: #000; border-radius: 12px; overflow: hidden;
      margin-bottom: 12px;
    }
    #video, #captured {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    #captured { display: none; }
    .cam-status { position: absolute; top:8px; left:8px; right:8px;
      color:#fff; font-size:12px; text-align:center;
      text-shadow: 0 1px 2px rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>📍 เช็คอิน</h1>
    <div class="subtitle">สแกนหน้า 4 ครั้ง/วัน — บังคับถ่ายสด ห้ามเลือกรูป</div>

    <div id="error" class="error" style="display:none"></div>
    <div id="success" class="success-banner" style="display:none"></div>

    <div id="boot-loading" class="muted">กำลังโหลด...</div>

    <div id="content" style="display:none">
      <div class="label">ชื่อ</div>
      <div id="name" class="name-box">—</div>

      <div class="label">สถานะวันนี้</div>
      <div id="slot-grid" class="slot-status-grid"></div>

      <div id="current-slot-banner" class="current-slot-banner">—</div>

      <div class="label">พิกัด GPS</div>
      <div id="gps" class="userid-box loading">กำลังขอพิกัด...</div>

      <div id="video-wrap">
        <div id="cam-status" class="cam-status">กำลังเปิดกล้อง...</div>
        <video    id="video"    autoplay muted playsinline></video>
        <img      id="captured" alt="captured" />
      </div>

      <button id="btn-capture" class="btn-primary" disabled>📷 ถ่ายภาพ</button>
      <button id="btn-retake"  class="btn-secondary" style="display:none">ถ่ายใหม่</button>
      <button id="btn-submit"  class="btn-primary"  style="display:none;margin-top:10px">ส่งเช็คอิน</button>

      <div class="note">
        <strong>วิธี:</strong> กดถ่าย → กดส่ง → รอเจ้าของอนุมัติหลังจากครบ 4 ครั้ง<br/>
        นอกรัศมี = ส่งได้แต่ flag ให้เจ้าของพิจารณา
      </div>
    </div>
  </div>

  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script type="module">
    import { CONFIG } from './js/config.js';
    import { initAuth, state } from './js/auth.js';
    import { api } from './js/api.js';
    import { getGeolocation, showError, clearError } from './js/utils.js';
    import { startCamera, captureFromVideo, stopCamera } from './js/camera.js';

    const errEl   = document.getElementById('error');
    const okEl    = document.getElementById('success');
    const bootEl  = document.getElementById('boot-loading');
    const contentEl = document.getElementById('content');
    const nameEl  = document.getElementById('name');
    const gridEl  = document.getElementById('slot-grid');
    const bannerEl = document.getElementById('current-slot-banner');
    const gpsEl   = document.getElementById('gps');
    const videoEl = document.getElementById('video');
    const capturedEl = document.getElementById('captured');
    const camStatusEl = document.getElementById('cam-status');
    const btnCapture = document.getElementById('btn-capture');
    const btnRetake  = document.getElementById('btn-retake');
    const btnSubmit  = document.getElementById('btn-submit');

    let camStream = null;
    let coords = null;
    let capturedBase64 = null;
    let todayStatus = null;

    async function boot() {
      try {
        await initAuth(CONFIG.LIFF_ID_CHECKIN);
      } catch (e) {
        bootEl.style.display = 'none';
        showError(errEl, 'LIFF init: ' + e.message);
        return;
      }
      try {
        todayStatus = await api.post('getTodayStatus', { lineUserId: state.lineUserId });
      } catch (e) {
        bootEl.style.display = 'none';
        if (e.code === 'not_registered') {
          showError(errEl, 'ยังไม่ได้ลงทะเบียน — กดเมนู "ลงทะเบียน" ก่อน');
        } else if (e.code === 'inactive') {
          showError(errEl, 'บัญชีถูกระงับ — ติดต่อเจ้าของ');
        } else {
          showError(errEl, e.message || e.code);
        }
        return;
      }

      nameEl.textContent = todayStatus.displayName + ' (' + todayStatus.employeeId + ')';
      renderSlotGrid(todayStatus);

      bootEl.style.display = 'none';
      contentEl.style.display = 'block';

      // ขอ GPS + เปิดกล้องคู่ขนาน
      fetchGps();
      openCamera();
    }

    function renderSlotGrid(status) {
      const cur = status.currentSlot;
      gridEl.innerHTML = status.slots.map(function (s) {
        const cls = s.completed ? 'done' : (s.slot === cur ? 'current' : '');
        const icon = s.completed ? '✓' : (s.slot === cur ? '⏳' : '—');
        return '<div class="slot-status ' + cls + '">' +
                  '<span class="icon">' + icon + '</span>' +
                  '<span class="label">' + s.label + '</span>' +
                '</div>';
      }).join('');

      const curSlot = status.slots.find(function(s){ return s.slot === cur; });
      if (curSlot && curSlot.completed) {
        bannerEl.style.background = '#888';
        bannerEl.textContent = '"' + status.currentSlotLabel + '" สแกนไปแล้ว — รอ slot ถัดไป';
        btnCapture.disabled = true;
        btnCapture.textContent = 'สแกนซ้ำไม่ได้';
      } else {
        bannerEl.textContent = '🎯 กำลังสแกน slot ที่ ' + cur + ': "' + status.currentSlotLabel + '"';
      }
    }

    async function fetchGps() {
      try {
        coords = await getGeolocation();
        gpsEl.textContent = coords.lat.toFixed(6) + ', ' + coords.lng.toFixed(6) + ' (±' + Math.round(coords.accuracy) + 'm)';
        gpsEl.classList.remove('loading');
        updateBtn();
      } catch (e) {
        showError(errEl, e.message + ' — เปิด location ใน LINE setting');
        gpsEl.textContent = '—';
        gpsEl.classList.remove('loading');
      }
    }

    async function openCamera() {
      try {
        camStream = await startCamera(videoEl, 'user');
        camStatusEl.style.display = 'none';
        updateBtn();
      } catch (e) {
        camStatusEl.textContent = 'กล้องไม่พร้อม: ' + (e.message || '');
        showError(errEl, 'กล้องไม่พร้อม — อนุญาต permission กล้องใน LINE');
      }
    }

    btnCapture.addEventListener('click', () => {
      try {
        capturedBase64 = captureFromVideo(videoEl);
        capturedEl.src = capturedBase64;
        videoEl.style.display = 'none';
        capturedEl.style.display = 'block';
        btnCapture.style.display = 'none';
        btnRetake.style.display = 'block';
        btnSubmit.style.display = 'block';
      } catch (e) {
        showError(errEl, e.message);
      }
    });

    btnRetake.addEventListener('click', () => {
      capturedBase64 = null;
      capturedEl.src = '';
      capturedEl.style.display = 'none';
      videoEl.style.display = 'block';
      btnRetake.style.display = 'none';
      btnSubmit.style.display = 'none';
      btnCapture.style.display = 'block';
    });

    btnSubmit.addEventListener('click', async () => {
      clearError(errEl);
      if (!coords) { showError(errEl, 'ยังไม่มี GPS'); return; }
      if (!capturedBase64) { showError(errEl, 'ยังไม่ได้ถ่ายรูป'); return; }
      btnSubmit.disabled = true;
      btnSubmit.textContent = 'กำลังส่ง...';
      try {
        const result = await api.post('checkin', {
          lineUserId:   state.lineUserId,
          lat:          coords.lat,
          lng:          coords.lng,
          selfieBase64: capturedBase64,
          slot:         todayStatus.currentSlot,
        });

        // ปิดกล้อง
        stopCamera(camStream); camStream = null;

        okEl.style.display = 'block';
        let msg = '';
        if (result.alreadyScanned) {
          msg = '⏰ slot นี้สแกนไปแล้ว';
        } else if (result.completed) {
          msg = '✅ สแกนครบ 4/4 — ส่ง flex card หาเจ้าของแล้ว';
        } else {
          msg = '✓ slot ' + result.slot + ' (' + result.slotLabel + ') บันทึกแล้ว — สแกน ' +
                result.scanCount + '/4';
        }
        if (result.outOfRange) {
          okEl.style.background = '#fff3e0';
          okEl.style.borderLeftColor = '#e65100';
          okEl.style.color = '#e65100';
          msg += '\n⚠️ นอกรัศมี ' + result.distanceM + ' m — flag ส่งให้เจ้าของพิจารณา';
        }
        okEl.style.whiteSpace = 'pre-line';
        okEl.textContent = msg;

        // ซ่อนปุ่มหลังส่ง
        btnSubmit.style.display = 'none';
        btnRetake.style.display = 'none';
        bannerEl.style.display = 'none';
      } catch (e) {
        showError(errEl, 'ผิดพลาด: ' + (e.message || e.code));
        btnSubmit.disabled = false;
        btnSubmit.textContent = 'ส่งเช็คอิน';
      }
    });

    function updateBtn() {
      const ready = coords && camStream;
      // ถ้า slot ปัจจุบันสแกนไปแล้ว — ปุ่มยังถูก disable จาก renderSlotGrid
      const slotDone = todayStatus && todayStatus.slots.find(function(s){ return s.slot === todayStatus.currentSlot && s.completed; });
      btnCapture.disabled = !ready || !!slotDone;
    }

    // cleanup กล้องเมื่อปิดหน้า
    window.addEventListener('pagehide', () => stopCamera(camStream));

    boot();
  </script>
</body>
</html>
